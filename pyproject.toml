[project]
name = "llm-observability"
version = "0.1.0"
description = "Shared logging, prompt-versioning, eval, and guardrails layer for LLM calls across projects"
authors = [{ name = "Sourabh Sagar", email = "sgrsourabh111@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_observability*"]
